# TypeScript SDK quality gate: the generated wire, tsc strict, and vitest. Fakes only, no network.
name: typescript

on:
  push:
    branches: [main]
    paths: ["typescript/**", "contract/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["typescript/**", "contract/**", ".github/workflows/typescript.yml"]

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: extractions/setup-just@v3
      - run: npm ci
      - run: just ci
