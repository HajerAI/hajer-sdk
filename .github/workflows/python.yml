# Python SDK quality gate: `just ci` (lockfile, ruff, basedpyright strict, vulture, deptry and the full
# pytest suite) on every Python version the package supports.
#
# No network: every test uses httpx.MockTransport and fake provider clients. `contract/` is in `paths`
# because the redaction tests read the vectors vendored there.
name: python

on:
  push:
    branches: [main]
    paths: ["python/**", "contract/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "contract/**", ".github/workflows/python.yml"]

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: just ci (${{ matrix.python }})
    runs-on: ubuntu-latest
    # uv takes the runner's own interpreter when it matches (3.12 is Ubuntu 24.04's `python3.12`, Debian-patched)
    # and downloads the others, so the matrix also covers a distribution-patched `sysconfig`.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: ${{ matrix.python }}
      - uses: extractions/setup-just@v3
      - run: uv sync --frozen --all-extras
      - run: just ci

  evals:
    # The golden end-to-end test of `hajer eval`: the pinned engine, installed from the npm registry on a cache
    # miss and reused from `~/.cache/hajer/engine` otherwise (the key is the lockfile's hash), runs the example
    # suite with the real OTLP receiver and the real Python hook. Opt-in (`--engine`) because it is the one place
    # the suite needs Node and, once, the network.
    name: hajer eval on the pinned engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hajer/engine
          key: hajer-engine-${{ runner.os }}-${{ hashFiles('python/hajer/evals/engine/package-lock.json') }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --engine -m engine -q

  build:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      # The wheel installs into a clean environment with only its declared dependencies, imports, and is
      # inert without a key — the first thing a user does after `pip install hajer`.
      - run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import hajer; assert hajer.HajerSettings.from_env().inert; print(hajer.__version__)"
      # The engine pin ships as package data, and `hajer` is a console script whose help needs no Node.
      - run: |
          unzip -l dist/*.whl | grep -E "hajer/evals/engine/package(-lock)?\.json"
          /tmp/smoke/bin/hajer --help
          /tmp/smoke/bin/hajer eval --help
